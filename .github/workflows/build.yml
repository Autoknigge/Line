name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_OPEN_ID: ${{ secrets.ADMOB_OPEN_ID }}
      KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_KEY_PW: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ganze Historie: die Versionsnummer zählt die Commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test-APK bauen (nur wenn noch kein Schlüssel hinterlegt ist)
        if: env.HAS_KEYSTORE != 'true'
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE != 'true'
        with:
          name: Line-Test
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Keystore bereitstellen
        if: env.HAS_KEYSTORE == 'true'
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signierte APK und AAB bauen (identischer Stand)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          # Zeilenumbrüche und Leerzeichen am Rand der Secrets entfernen (häufiger Einfüge-Fehler)
          KS_PW_C="$(printf '%s' "$KS_PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          KS_ALIAS_C="$(printf '%s' "$KS_ALIAS" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          KS_KEY_PW_C="$(printf '%s' "$KS_KEY_PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          gradle assembleRelease bundleRelease --no-daemon \
            -PADMOB_APP_ID="$ADMOB_APP_ID" \
            -PADMOB_BANNER_ID="$ADMOB_BANNER_ID" \
            -PADMOB_OPEN_ID="$ADMOB_OPEN_ID" \
            -PKEYSTORE_FILE="$RUNNER_TEMP/release.jks" \
            -PKEYSTORE_PASSWORD="$KS_PW_C" \
            -PKEY_ALIAS="$KS_ALIAS_C" \
            -PKEY_PASSWORD="$KS_KEY_PW_C"

      - name: Release-Dateien umbenennen
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Line.apk
          cp app/build/outputs/bundle/release/app-release.aab Line.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: Line
          path: |
            Line.apk
            Line.aab

      - name: GitHub-Release (bei Tag, z. B. 1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Line.apk
            Line.aab
          fail_on_unmatched_files: false
